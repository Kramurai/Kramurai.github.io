name: Kramurai audit checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  audit:
    if: github.head_ref == 'audit/2026-11-20-core-guards'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get install --yes poppler-utils
          BROWSER_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          echo "CHROMIUM_EXECUTABLE=$BROWSER_PATH" >> "$GITHUB_ENV"
          ln -s "$BROWSER_PATH" /tmp/chromium
      - name: Run existing checks and regression cases
        run: |
          failed=0
          for test in tools/check_*.cjs; do
            echo "::group::$test"
            if timeout 180 node "$test"; then
              echo "PASS $test"
            else
              echo "FAIL $test"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

